services:
  constructor-pg:
    image: postgres:16-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: constructor
      POSTGRES_PASSWORD: constructor
      POSTGRES_DB: constructor
    volumes:
      - constructor_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U constructor -d constructor"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  constructor-redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    restart: unless-stopped

  constructor-rabbit:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: constructor
      RABBITMQ_DEFAULT_PASS: constructor
    restart: unless-stopped

  constructor-chat-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://constructor-redis:6379/0
      RABBITMQ_URL: amqp://constructor:constructor@constructor-rabbit:5672/
      DATABASE_URL: postgresql+psycopg://constructor:constructor@host.docker.internal:5435/constructor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - constructor-redis
      - constructor-rabbit
    command: python -m app.modules.chat.worker
    restart: unless-stopped

  constructor-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://constructor-redis:6379/0
      DATABASE_URL: postgresql+psycopg://constructor:constructor@host.docker.internal:5435/constructor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - constructor-redis
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped

  constructor-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://constructor-redis:6379/0
      DATABASE_URL: postgresql+psycopg://constructor:constructor@host.docker.internal:5435/constructor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - constructor-redis
    command: celery -A app.celery_app beat --loglevel=info
    restart: unless-stopped

volumes:
  constructor_pg:
